name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Upgrading pip first keeps the audit focused on this project's dependency
      # tree rather than failing on CVEs in the packaging tooling itself.
      - run: pip install -U pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - name: Audit dependencies for known vulnerabilities
        run: pip install pip-audit && pip-audit --progress-spinner off
